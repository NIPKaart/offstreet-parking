[project]
name = "offstreet-parking"
version = "0.0.0"
description = "A tool to fetch offstreet parking data for NIPKaart."
requires-python = ">=3.14,<4.0"
authors = [{ name = "NIPKaart", email = "hello@nipkaart.nl" }]
maintainers = [{ name = "Klaas Schoute", email = "hello@student-techlife.com" }]
license = "MIT"
readme = "README.md"
keywords = ["offstreet", "parking", "nipkaart", "locations", "api"]
dependencies = ["boto3>=1.40,<2"]

[project.urls]
Homepage = "https://github.com/nipkaart/offstreet-parking"
Repository = "https://github.com/nipkaart/offstreet-parking"
Documentation = "https://github.com/nipkaart/offstreet-parking"

[dependency-groups]
cities = [
  "hamburg",
  "odp-amsterdam>=7.2.0,<7.3.0",
]
dev = [
  "pre-commit==3.8.0",
  "pre-commit-hooks==4.6.0",
  "pylint==3.3.9",
  "ruff==0.16.10",
  "yamllint==1.38.0",
]

[tool.uv.sources]
hamburg = { git = "https://github.com/klaasnicolaas/python-hamburg", rev = "d72491017f3380109f0ddb613fb5fddab40ed83c" }

[tool.uv]
package = false
default-groups = ["cities", "dev"]

[tool.pylint.BASIC]
good-names = [
  "_",
  "ex",
  "fp",
  "i",
  "id",
  "j",
  "k",
  "on",
  "Run",
  "T",
]

[tool.pylint."MESSAGES CONTROL"]
disable= [
  "too-few-public-methods",
  "too-many-arguments",
  "duplicate-code",
  "format",
  "unsubscriptable-object",
  "broad-except",
]

[tool.pylint.SIMILARITIES]
ignore-imports = true

[tool.pylint.FORMAT]
max-line-length = 88

[tool.pylint.DESIGN]
max-attributes = 20

[tool.ruff]
target-version = "py314"
lint.select = ["ALL"]
lint.ignore = [
  "CPY001", # Copyright is documented in LICENSE
  "ANN401", # Opinioated warning on disallowing dynamically typed expressions
  "D203", # Conflicts with other rules
  "D213", # Conflicts with other rules
  "D417", # False positives in some occasions
  "PLR2004", # Just annoying, not really useful
  "T201", # Allow the use of print()

  # Conflicts with the Ruff formatter
  "COM812",
  "ISC001",
]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["PT009", "PT027"] # Standard-library unittest, no pytest dependency

[tool.ruff.lint.flake8-pytest-style]
mark-parentheses = false
fixture-parentheses = false
